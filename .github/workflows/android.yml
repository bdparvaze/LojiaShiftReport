name: Android CI & Quality Checks

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build, Verify Localization & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew || true

      - name: Verify String Localization
        run: gradle :app:verifyStringLocalization --no-daemon

      - name: Assemble Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest --no-daemon
